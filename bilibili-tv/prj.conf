# the whole image runs in place from the flash window of the SPIF controller (boards/yuzukineko.overlay)
CONFIG_XIP=y

CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
# the audio and the video thread read the same card, and the downloader writes to it
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_PRINTK=y
CONFIG_SHELL=n
# stack use of every thread: kernel stacks; an overflow is caught by the sentinel
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
CONFIG_DEVMEM_SHELL=n
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_THREAD_PRIORITY=6
CONFIG_THREAD_NAME=y
CONFIG_SPEED_OPTIMIZATIONS=y

# drivers the application does not use
CONFIG_G2D=n
CONFIG_ADC=n
CONFIG_SPI=n
CONFIG_MIPI_DBI=n
CONFIG_WDT_SUNXI=n
CONFIG_GPIO=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# the player. The budget of the video decoder is what is left of the 16 MB after the image (the font, the
# frame buffer and the WiFi firmware are in it): the stream buffer (NEKOBOX_VIDEO_STREAM_KB, 256) and the
# rest for the pictures, 4300 KiB is 11 pictures of 640x360. With 3200 only 6 were made, the decoder
# (references, the picture in work, the converted one, the one on the screen) found none free and stood
# still after the first picture; with 9 there were pictures late all the time. 12288, the default, does
# not fit the memory.
CONFIG_VDEC_SUNXI_MAX_MEMORY_KB=7168
CONFIG_MP4_DEMUX=y
CONFIG_VDEC=y
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_DMA=y
CONFIG_OPENCORE_AAC=y

# the user interface: LVGL on the ARGB frame buffer plane, over the video plane
CONFIG_DISPLAY=y
CONFIG_DISPLAY_SUNXI_ARGB8888=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_32=y
CONFIG_LV_Z_MEM_POOL_SIZE=786432
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_SHELL=n
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_BAR=y
# bili shot: the screen as a picture over the serial line (there is no camera on the bench)
CONFIG_LV_USE_SNAPSHOT=y
# a character that the font does not have is left blank, not drawn as a box
CONFIG_LV_USE_FONT_PLACEHOLDER=n
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_IME_PINYIN=y
CONFIG_LV_IME_PINYIN_USE_DEFAULT_DICT=n
CONFIG_LV_IME_PINYIN_CAND_TEXT_NUM=10
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
# the Chinese font is in the image
CONFIG_LV_USE_TINY_TTF=y
# software JPEG decoder for the covers that the video engine refuses
CONFIG_LV_USE_TJPGD=y

# Wi-Fi (AIC8800 on SMHC2)
CONFIG_AIC8800=y
# the driver used at most 310 KiB of its pool in the tests
CONFIG_AIC8800_MEM_POOL_KB=400
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_TCP_WORKQ_STACK_SIZE=3072
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
CONFIG_NET_SOCKETS=y
# the receive window must fit in the buffers: a burst of a peer with a bigger window than the pool was
# dropped and every loss cost a retransmission time out (a 10 KB cover took 2 s)
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_BUF_RX_COUNT=192
CONFIG_NET_BUF_TX_COUNT=96
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=16384
# every request opens a connection of its own; a closed one is held for the time wait: with the cover
# threads the table of 16 ran out ("Not enough connection contexts", connect() answered ENOENT)
CONFIG_NET_MAX_CONN=48
CONFIG_NET_MAX_CONTEXTS=48
CONFIG_NET_TCP_TIME_WAIT_DELAY=500
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=4

# TLS for the API (the answers are a few KiB, but a handshake needs the records of the server)
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_PKCS1_V15=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_CURVE25519_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_SHA384=y
CONFIG_MBEDTLS_PKCS1_V21=y
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HASH_ALL_ENABLED=y

# a player that queues shown pictures needs spare ones (a torn picture when the conversion finds none)
CONFIG_VDEC_SUNXI_H264_EXTRA_PICTURES=6


