# The page lives in demand paged memory that is swapped to a file of the card.
# Build with -DEXTRA_CONF_FILE=paged.conf
CONFIG_SUN252I_F101_MMU=y
CONFIG_DEMAND_PAGING=y
CONFIG_DEMAND_PAGING_ALLOW_IRQ=y
CONFIG_DEMAND_PAGING_STATS=y
CONFIG_EVICTION_LRU=y
CONFIG_BACKING_STORE_SWAP=y
CONFIG_LITEHTML_PAGED_HEAP=y
# room for the paged region next to the image
CONFIG_KERNEL_VM_SIZE=0x10000000
# a finite arena: the frames of the display engine and the buffers of the drivers; the rest of
# the RAM is page frames for the pager
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=5242880
