CONFIG_MICROPY_HEAP_SIZE=1048576
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NETWORKING=n
CONFIG_SHELL=n
CONFIG_LOG=n

# SD card: mounted as /sd: by the port's _boot.py (FAT through MicroPython's own driver)
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# on-chip codec output for the f101 module
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

# f101.unique_id()
CONFIG_HWINFO=y
