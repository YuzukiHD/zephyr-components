# the whole image runs from the flash window of the SPIF controller (see boards/yuzukineko.overlay)
CONFIG_XIP=y

CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
# the audio and the video thread read the same card, and the file browser does too
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_PRINTK=y
CONFIG_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_MAIN_STACK_SIZE=16384
# the malloc arena is a fixed size: the buffers of the decoders, the display and the game ROM
# buffers (gpSP) come out of it
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_MAIN_THREAD_PRIORITY=8

# drivers the player does not use
CONFIG_G2D=n
CONFIG_ADC=n
CONFIG_SPI=n
CONFIG_MIPI_DBI=n
CONFIG_WDT_SUNXI=n
CONFIG_GPIO=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# the user interface: LVGL on the ARGB frame buffer plane, over the video plane
CONFIG_DISPLAY=y
CONFIG_DISPLAY_SUNXI_ARGB8888=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_32=y
CONFIG_LV_Z_MEM_POOL_SIZE=262144
CONFIG_LV_Z_VDB_SIZE=15
CONFIG_LV_Z_SHELL=n
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_ROLLER=y
CONFIG_LV_USE_LIST=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y

# the touch events are handled above the thread of the user interface: a long redraw of the main
# thread must not make the input queue overflow
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=2
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=32

# -Og is the default; the drawing code of LVGL and the decoders need the speed
CONFIG_SPEED_OPTIMIZATIONS=y

# the vector blends (src/gfx/lv_rvv.c) are included into the LVGL sources
CONFIG_LV_DRAW_SW_ASM_CUSTOM=y
CONFIG_LV_DRAW_SW_ASM_CUSTOM_INCLUDE="lv_rvv.h"

# the real time clock
CONFIG_RTC=y

CONFIG_NET_IPV6=n
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_THREAD_NAME=y
CONFIG_LV_Z_AUTO_INIT=n

# a card with no file system that can be read is never formatted by the player
CONFIG_FS_FATFS_MKFS=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# gpSP has C++ sources
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# gpSP keeps this much of a GBA ROM in memory (the rest is read from the card in pages); the 8 MiB
# arena also holds its translation caches and the pictures. mGBA only plays the small Game Boy ROMs.
CONFIG_GBSP_ROM_BUFFER_MB=5
CONFIG_MGBA_MAX_ROM_SIZE_MB=6
