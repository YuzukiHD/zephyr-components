CONFIG_POCKETJS=y
CONFIG_POCKETJS_GUEST_HEAP_LIMIT=4194304

CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_PRINTK=y
CONFIG_SHELL=n
CONFIG_MAIN_STACK_SIZE=98304
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
CONFIG_HEAP_MEM_POOL_SIZE=262144

CONFIG_DISPLAY=y

# drivers the sample does not use
CONFIG_G2D=y
CONFIG_USB_PHY_SUNXI=n
CONFIG_ADC=n
CONFIG_SPI=n
CONFIG_MIPI_DBI=n
CONFIG_WDT_SUNXI=n
CONFIG_VDEC=n
CONFIG_MAIN_THREAD_PRIORITY=6

# hardware floats and vectors for QuickJS and the Rust renderer
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_SUN252I_F101_RVV=y

CONFIG_INPUT=y
CONFIG_I2C=y
